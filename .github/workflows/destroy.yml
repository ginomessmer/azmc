name: Destroy

on:
  workflow_dispatch: 
    inputs:
      environment:
        description: 'Name of the environment'
        required: true
        default: development
        type: environment
      resource:
        description: 'Resource to destroy'
        required: true
        type: choice
        default: server
        options:
          - server
          - webmap

permissions: 
  id-token: write

jobs:
  destroy_server:
    runs-on: ubuntu-latest
    name: Destroy Server
    environment: ${{ github.event.inputs.environment }}
    if: ${{ github.event.inputs.resource == 'server' }}
    steps:
      - name: Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Container
        id: get_server
        run: |
          container_name=$(az deployment group show -g ${{ secrets.AZURE_RG_NAME }} -n server -o tsv --query properties.outputs.containerGroupName.value)
          echo "::set-output name=container_name::$container_name"

      - name: Delete Container
        run: az container delete -g ${{ secrets.AZURE_RG_NAME }} -n ${{ steps.get_server.outputs.container_name }} -y

  destroy_webmap:
    runs-on: ubuntu-latest
    name: Destroy Web Map
    environment: ${{ github.event.inputs.environment }}
    if: ${{ github.event.inputs.resource == 'webmap' }}
    steps:
      - name: Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Storage Account Name
        id: storage_account
        run: |
          echo "NAME=$(az deployment group show -n storageRenderer -g ${{ secrets.AZURE_RG_NAME }} --query properties.outputs.storageAccountPublicMapName.value -o tsv)" >> $GITHUB_OUTPUT

      - name: Generate SAS Token
        id: sas_token
        env:
          AZURE_STORAGE_ACCOUNT: ${{ steps.storage_account.outputs.NAME }}
        run: |
          end=`date -u -d "30 minutes" '+%Y-%m-%dT%H:%MZ'`
          sas_token=$(az storage account generate-sas --services f --resource-types o --permissions dly --expiry $end -o tsv)
          echo "TOKEN=$sas_token" >> $GITHUB_OUTPUT

      - name: Delete Web Map Directory
        env:
          AZCOPY_AUTO_LOGIN_TYPE: AZCLI
          AZURE_STORAGE_ACCOUNT: ${{ steps.storage_account.outputs.NAME }}
          SAS_TOKEN: ${{ steps.sas_token.outputs.TOKEN }}
          SHARE_NAME: web
          DIR_NAME: maps
        run: azcopy remove "https://$AZURE_STORAGE_ACCOUNT.file.core.windows.net/$SHARE_NAME/$DIR_NAME?$SAS_TOKEN" --recursive --log-level=INFO --trailing-dot=Enable
